name: Test build tooling

on:
  push:
  pull_request:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python build script
        run: python3 -m py_compile build.py
      - name: Check macOS installer syntax
        run: bash -n install-macos.sh

  release-provenance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release tag verification
        run: python -m unittest discover -s tests -v
